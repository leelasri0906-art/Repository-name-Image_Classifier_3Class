<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Image Classifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .classes {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .class-box {
            padding: 12px 18px;
            background: #f1f3f5;
            border-radius: 12px;
            font-weight: bold;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            display: block;
            margin: auto;
            padding: 14px 35px;
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 18px;
            background: #f8f9fa;
        }

        .prediction {
            font-size: 32px;
            font-weight: bold;
            margin: 10px;
        }

        .confidence {
            font-size: 18px;
            color: #555;
        }

        .preview {
            margin-top: 20px;
            max-width: 100%;
            max-height: 300px;
            border-radius: 15px;
        }

        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Image Classifier</h1>

    <p class="subtitle">
        Upload an image and let AI identify the object.
    </p>

    <div class="classes">
        <div class="class-box">🚗 Car</div>
        <div class="class-box">🐱 Cat</div>
        <div class="class-box">🐶 Dog</div>
    </div>

    <form method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <button type="submit">
            🔍 Classify Image
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    {% if prediction %}

        <div class="result">

            <h2>Prediction</h2>

            <div class="prediction">
                {{ prediction | title }}
            </div>

            <div class="confidence">
                Confidence:
                {{ "%.2f"|format(confidence) }}%
            </div>

            {% if image_url %}
                <img
                    src="{{ image_url }}"
                    class="preview"
                    alt="Uploaded Image"
                >
            {% endif %}

        </div>

    {% endif %}

</div>

</body>
</html>
